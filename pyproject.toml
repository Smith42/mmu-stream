[project]
name = "mmu-stream"
version = "0.0.0"
description = "Hub-and-spoke HATS record streaming"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "datasets>=4.3",
    "hats",
    "pyarrow",
    "fsspec",
]

[project.optional-dependencies]
index = [
    "lsdb",
    "dask",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmu_stream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that stream live MMU catalogs from the HF hub",
]
